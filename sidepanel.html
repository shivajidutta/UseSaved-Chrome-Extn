<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UseSaved Search</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>

<!-- LOADING VIEW (default while the auth check runs) -->
<div id="sp-loading-view">
  <header class="sp-header">
    <svg class="sp-logo-svg" viewBox="0 0 708 946" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-miterlimit:10;">
      <path d="M613.871,23.91l0,555.69c0,57.421 -46.618,104.039 -104.039,104.039l-312.116,0c-57.421,0 -104.039,-46.618 -104.039,-104.039l0,-555.69l260.097,175.223l260.097,-175.223Z" style="fill:#ffffff;"/>
      <path d="M241.274,466.274l112.5,-112.5l112.5,112.5" style="fill:none;stroke:#03c4a1;stroke-width:75px;"/>
      <path d="M353.774,591.676l0,-237.902" style="fill:none;stroke:#03c4a1;stroke-width:75px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
      <path d="M179.846,307.144l0,-54.674l340.86,0l0,54.674" style="fill:none;stroke:#c03088;stroke-width:64.1px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
    </svg>
    <div class="sp-wordmark">
      <span class="sp-word-use">Use</span>
      <span class="sp-word-saved">Saved</span>
    </div>
  </header>
  <div class="sp-skel-body">
    <div class="sp-skel sp-skel-bar"></div>
    <div class="sp-skel sp-skel-box"></div>
    <div class="sp-skel sp-skel-btn"></div>
    <p class="sp-loading-slow">Still connecting&hellip;</p>
  </div>
</div>

<!-- LOGIN VIEW -->
<div id="sp-login-view" style="display:none">
  <header class="sp-header">
    <svg class="sp-logo-svg" viewBox="0 0 708 946" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-miterlimit:10;">
      <path d="M613.871,23.91l0,555.69c0,57.421 -46.618,104.039 -104.039,104.039l-312.116,0c-57.421,0 -104.039,-46.618 -104.039,-104.039l0,-555.69l260.097,175.223l260.097,-175.223Z" style="fill:#ffffff;"/>
      <path d="M241.274,466.274l112.5,-112.5l112.5,112.5" style="fill:none;stroke:#03c4a1;stroke-width:75px;"/>
      <path d="M353.774,591.676l0,-237.902" style="fill:none;stroke:#03c4a1;stroke-width:75px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
      <path d="M179.846,307.144l0,-54.674l340.86,0l0,54.674" style="fill:none;stroke:#c03088;stroke-width:64.1px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
    </svg>
    <div class="sp-wordmark">
      <span class="sp-word-use">Use</span>
      <span class="sp-word-saved">Saved</span>
    </div>
  </header>

  <div class="sp-body">
    <p class="sp-welcome-sub">Sign in to search your saved knowledge</p>

    <button id="sp-login-btn" class="sp-btn-primary">Sign In</button>

    <div id="sp-login-form" style="display:none">
      <input type="email" id="sp-email" class="sp-input" placeholder="your@email.com" />
      <input type="password" id="sp-password" class="sp-input" placeholder="Password" />
      <button id="sp-submit-login" class="sp-btn-primary">Log In</button>
      <p id="sp-login-error" class="sp-error" style="display:none"></p>
      <p style="text-align:right;margin-top:8px;font-size:12px">
        <a href="#" id="sp-forgot-password-link" style="color:#590995;text-decoration:none">Forgot password?</a>
      </p>
    </div>

    <div id="sp-current-page-box" class="sp-current-page-box">
      <p class="sp-box-label">Current page</p>
      <p id="sp-current-title" class="sp-box-title"></p>
      <p id="sp-current-url" class="sp-box-url"></p>
    </div>

    <p class="sp-hint">No account? <a href="https://www.usesaved.com/waitlist" target="_blank">Join the waitlist</a></p>
  </div>
</div>

<!-- MAIN SEARCH VIEW -->
<div id="sp-main-view" style="display:none">
  <header class="sp-header">
    <svg class="sp-logo-svg" viewBox="0 0 708 946" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-miterlimit:10;">
      <path d="M613.871,23.91l0,555.69c0,57.421 -46.618,104.039 -104.039,104.039l-312.116,0c-57.421,0 -104.039,-46.618 -104.039,-104.039l0,-555.69l260.097,175.223l260.097,-175.223Z" style="fill:#ffffff;"/>
      <path d="M241.274,466.274l112.5,-112.5l112.5,112.5" style="fill:none;stroke:#03c4a1;stroke-width:75px;"/>
      <path d="M353.774,591.676l0,-237.902" style="fill:none;stroke:#03c4a1;stroke-width:75px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
      <path d="M179.846,307.144l0,-54.674l340.86,0l0,54.674" style="fill:none;stroke:#c03088;stroke-width:64.1px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
    </svg>
    <div class="sp-wordmark">
      <span class="sp-word-use">Use</span>
      <span class="sp-word-saved">Saved</span>
    </div>
  </header>

  <div class="sp-body">
    <p id="sp-greeting" class="sp-greeting"></p>
    <p class="sp-search-label">What can I help you find?</p>

    <div class="sp-search-wrap">
      <svg class="sp-search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="#590995" stroke-width="2"/>
        <path d="M16.5 16.5L21 21" stroke="#590995" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <textarea id="sp-search-input" class="sp-search-textarea" rows="2"
        placeholder="Describe what you're looking for..."></textarea>
    </div>

    <button id="sp-search-btn" class="sp-btn-search">Search</button>

    <div id="sp-results-area">
      <p id="sp-results-hint" class="sp-hint-center">Type above and press Search</p>
      <div id="sp-results-list"></div>
    </div>
  </div>

  <footer class="sp-footer">
    <button id="sp-dashboard-btn" class="sp-btn-dashboard">Open Dashboard →</button>
  </footer>
</div>

<script src="supabase.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
