<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UseSaved</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

<!-- LOGIN VIEW -->
<div id="login-view">
  <header class="us-header">
    <svg class="us-logo-svg" viewBox="0 0 708 946" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-miterlimit:10;">
      <path d="M613.871,23.91l0,555.69c0,57.421 -46.618,104.039 -104.039,104.039l-312.116,0c-57.421,0 -104.039,-46.618 -104.039,-104.039l0,-555.69l260.097,175.223l260.097,-175.223Z" style="fill:#ffffff;"/>
      <path d="M241.274,466.274l112.5,-112.5l112.5,112.5" style="fill:none;stroke:#03c4a1;stroke-width:75px;"/>
      <path d="M353.774,591.676l0,-237.902" style="fill:none;stroke:#03c4a1;stroke-width:75px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
      <path d="M179.846,307.144l0,-54.674l340.86,0l0,54.674" style="fill:none;stroke:#c03088;stroke-width:64.1px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
    </svg>
    <div class="us-wordmark">
      <span class="us-word-use">Use</span>
      <span class="us-word-saved">Saved</span>
    </div>
  </header>

  <div class="us-body">
    <p class="us-tagline">Your personal knowledge library</p>

    <button id="login-btn" class="us-btn-primary">Sign In</button>

    <div id="login-form" style="display:none">
      <input type="email" id="email-input" class="us-input" placeholder="your@email.com" />
      <input type="password" id="password-input" class="us-input" placeholder="Password" />
      <button id="submit-login-btn" class="us-btn-primary">Log In</button>
      <p id="login-error" class="us-error" style="display:none"></p>
    </div>

    <div id="page-preview-box" class="us-preview-box">
      <p id="login-page-title" class="us-preview-text">Sign in to save this page</p>
    </div>

    <p class="us-bottom-hint">No account? <a href="https://www.usesaved.com/waitlist" target="_blank">Join the waitlist</a></p>
  </div>
</div>

<!-- SAVE VIEW -->
<div id="save-view" style="display:none">
  <header class="us-header">
    <svg class="us-logo-svg" viewBox="0 0 708 946" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-miterlimit:10;">
      <path d="M613.871,23.91l0,555.69c0,57.421 -46.618,104.039 -104.039,104.039l-312.116,0c-57.421,0 -104.039,-46.618 -104.039,-104.039l0,-555.69l260.097,175.223l260.097,-175.223Z" style="fill:#ffffff;"/>
      <path d="M241.274,466.274l112.5,-112.5l112.5,112.5" style="fill:none;stroke:#03c4a1;stroke-width:75px;"/>
      <path d="M353.774,591.676l0,-237.902" style="fill:none;stroke:#03c4a1;stroke-width:75px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
      <path d="M179.846,307.144l0,-54.674l340.86,0l0,54.674" style="fill:none;stroke:#c03088;stroke-width:64.1px;stroke-linejoin:round;stroke-miterlimit:1.5;"/>
    </svg>
    <div class="us-wordmark">
      <span class="us-word-use">Use</span>
      <span class="us-word-saved">Saved</span>
    </div>
  </header>

  <div class="us-body">
    <div id="page-info-box" class="us-page-box">
      <p id="page-title" class="us-page-title"></p>
      <p id="page-url" class="us-page-url"></p>
    </div>

    <textarea id="save-note" class="us-textarea" rows="3" placeholder="Why are you saving this? (optional)"></textarea>

    <button id="save-btn" class="us-btn-save">Save This Page</button>

    <div id="status-msg" class="us-status" style="display:none"></div>

    <button id="open-search-btn" class="us-btn-secondary">Search my saves →</button>
  </div>

  <footer class="us-footer">
    <span id="credits-display" class="us-credits"></span>
    <a id="dashboard-link" href="https://app.usesaved.com" target="_blank">Dashboard</a>
    <a id="logout-link" href="#">Log out</a>
  </footer>

  <div class="us-bottom-bar">New here? <a href="https://app.usesaved.com" target="_blank">Sign up</a></div>
</div>

<script src="supabase.js"></script>
<script src="popup.js"></script>
</body>
</html>
